<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --border-color: #30363d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-purple: #bc8cff;
  }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    background: transparent;
  }
  .release-box {
    background: linear-gradient(135deg, rgba(88,166,255,0.1), rgba(63,185,80,0.1));
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px 20px;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .repo-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .repo-name {
    font-size: 18px;
    font-weight: 700;
    color: #f0f6fc;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tag-badge {
    background: rgba(63,185,80,0.2);
    color: var(--accent-green);
    border: 1px solid rgba(63,185,80,0.4);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .assets-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }
  .asset-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .asset-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .asset-name {
    font-size: 13px;
    font-weight: 600;
    color: #f0f6fc;
    font-family: Consolas, monospace;
  }
  .asset-size {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .asset-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .asset-tag-exe {
    background: rgba(88,166,255,0.15);
    color: var(--accent-blue);
    border: 1px solid rgba(88,166,255,0.3);
  }
  .asset-tag-apk {
    background: rgba(63,185,80,0.15);
    color: var(--accent-green);
    border: 1px solid rgba(63,185,80,0.3);
  }
</style>
</head>
<body>
<div class="release-box">
  <div class="repo-title">
    <div class="repo-name">
      <span>📦 yys9253462-gif / MicBridge</span>
    </div>
    <span class="tag-badge">v1.0.0 Public Release</span>
  </div>
  <div style="font-size: 12px; color: var(--text-secondary);">
    已成功发布开源项目并附加双端预编译二进制资产，支持开箱即用直接下载：
  </div>
  <div class="assets-grid">
    <div class="asset-card">
      <div class="asset-info">
        <span class="asset-name">MicBridge.PC.exe</span>
        <span class="asset-size">33.86 MB · Windows x64 自包含单文件</span>
      </div>
      <span class="asset-tag asset-tag-exe">.EXE</span>
    </div>
    <div class="asset-card">
      <div class="asset-info">
        <span class="asset-name">MicBridge.apk</span>
        <span class="asset-size">15.0 MB · Android 原生安装包</span>
      </div>
      <span class="asset-tag asset-tag-apk">.APK</span>
    </div>
  </div>
</div>
</body>
</html>
